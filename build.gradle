plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = "https://repo.viaversion.com"
    }
    maven {
        url = 'https://repo.maven.apache.org/maven2/'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // compileOnlyApi:relocated gson(com.viaversion.viaversion.libs.gson)既供本工程编译,也透传到
    // 消费方(BedrockMotion/ViaBedrock)的 compile classpath——它们需要它来解析本库解析器的重载签名
    // (parse(JsonObject) 等)。不进运行期(由 ViaVersion 提供)。plain 分支(NeoForge)无此依赖,天然区分风味。
    compileOnlyApi("com.viaversion:viaversion-common:5.9.2-SNAPSHOT") {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
    }

    implementation 'org.projectlombok:lombok:1.18.36'
    implementation "org.joml:joml:1.10.8"
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
}

group = 'org.oryxel.cube'
version = '1.3'
description = 'cubeconverter'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
        // JitPack 使用 com.github.<org>:<repo> 坐标，本地也发布一份兼容的
        jitpackCompat(MavenPublication) {
            groupId = 'com.github.EaseCation'
            artifactId = 'CubeConverter'
            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/oryxel/cubeconverter"
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}
